name: Build and deploy

"on":
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/ivaluate

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: web
            dockerfile: client/Dockerfile
          - name: api
            dockerfile: server/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:latest

  deploy:
    needs: images
    runs-on: ubuntu-latest
    env:
      VPS_A_HOST: ${{ secrets.VPS_A_HOST }}
      VPS_A_SSH_KEY: ${{ secrets.VPS_A_SSH_KEY }}
      GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        if: env.VPS_A_HOST != '' && env.VPS_A_SSH_KEY != '' && env.GHCR_PULL_TOKEN != ''
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${VPS_A_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${VPS_A_HOST}" >> ~/.ssh/known_hosts
      - name: Apply manifests and roll out images
        if: env.VPS_A_HOST != '' && env.VPS_A_SSH_KEY != '' && env.GHCR_PULL_TOKEN != ''
        run: |
          ssh root@"${VPS_A_HOST}" "mkdir -p /root/ivaluate-k8s"
          scp deploy/k8s/* root@"${VPS_A_HOST}":/root/ivaluate-k8s/
          ssh root@"${VPS_A_HOST}" "
            ML_IMAGE=\$(kubectl -n ivaluate get deployment ivaluate-ml \
              -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true) &&
            kubectl -n ivaluate create secret docker-registry ghcr-pull \
              --docker-server=ghcr.io \
              --docker-username='${{ github.repository_owner }}' \
              --docker-password='${GHCR_PULL_TOKEN}' \
              --dry-run=client -o yaml | kubectl apply -f - &&
            kubectl -n ivaluate patch serviceaccount default \
              -p '{\"imagePullSecrets\":[{\"name\":\"ghcr-pull\"}]}' &&
            kubectl apply -k /root/ivaluate-k8s &&
            kubectl -n ivaluate set image deployment/ivaluate-web web=${IMAGE_PREFIX}-web:${GITHUB_SHA} &&
            kubectl -n ivaluate set image deployment/ivaluate-api api=${IMAGE_PREFIX}-api:${GITHUB_SHA} &&
            if [ -n \"\$ML_IMAGE\" ]; then
              kubectl -n ivaluate set image deployment/ivaluate-ml ml=\"\$ML_IMAGE\";
            fi &&
            kubectl -n ivaluate rollout status deployment/ivaluate-web --timeout=180s &&
            kubectl -n ivaluate rollout status deployment/ivaluate-api --timeout=180s
          "
