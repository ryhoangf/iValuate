apiVersion: apps/v1
kind: Deployment
metadata:
  name: ivaluate-ml
  namespace: ivaluate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ivaluate-ml
  template:
    metadata:
      labels:
        app: ivaluate-ml
    spec:
      nodeSelector:
        role: data-processing
      containers:
        - name: ml
          image: localhost/ivaluate-ml:v4
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_HOST
              value: "157.66.100.135"
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_DB
              value: ivaluate
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: ivaluate-mysql-remote
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ivaluate-mysql-remote
                  key: MYSQL_PASSWORD
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ivaluate-ml
  namespace: ivaluate
spec:
  selector:
    app: ivaluate-ml
  ports:
    - port: 8000
      targetPort: 8000
