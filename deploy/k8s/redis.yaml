apiVersion: apps/v1
kind: Deployment
metadata:
  name: ivaluate-redis
  namespace: ivaluate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ivaluate-redis
  template:
    metadata:
      labels:
        app: ivaluate-redis
    spec:
      nodeSelector:
        role: serving
      containers:
        - name: redis
          image: redis:7.4-alpine
          args:
            - redis-server
            - --save
            - ""
            - --appendonly
            - "no"
            - --maxmemory
            - 512mb
            - --maxmemory-policy
            - allkeys-lru
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 640Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ivaluate-redis
  namespace: ivaluate
spec:
  selector:
    app: ivaluate-redis
  ports:
    - port: 6379
      targetPort: 6379

