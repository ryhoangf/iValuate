apiVersion: apps/v1
kind: Deployment
metadata:
  name: ivaluate-api
  namespace: ivaluate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ivaluate-api
  template:
    metadata:
      labels:
        app: ivaluate-api
    spec:
      nodeSelector:
        role: serving
      containers:
        - name: api
          image: localhost/ivaluate-api:v2
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: ivaluate-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: ivaluate-mysql-remote
                  key: MYSQL_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ivaluate-mysql-remote
                  key: MYSQL_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ivaluate-secrets
                  key: JWT_SECRET
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: ivaluate-secrets
                  key: SMTP_USER
                  optional: true
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: ivaluate-secrets
                  key: SMTP_PASS
                  optional: true
            - name: MAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: ivaluate-secrets
                  key: MAIL_FROM
                  optional: true
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ivaluate-api
  namespace: ivaluate
spec:
  selector:
    app: ivaluate-api
  ports:
    - port: 5000
      targetPort: 5000
